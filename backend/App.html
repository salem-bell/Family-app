<style>
  :root{ --bg:#FFF6EA; --card:#fff; --ink:#3f3a33; --line:#60584E; --soft:#E3CFB2; --muted:#7a7268; --accent:#50602B; --warn:#C0502A; --flag:#E6B342; --flagbg:#fdf3dc; --ok:#2E7D32;

  .ivory{ --bg:#FBF7F0; --card:#fff; --ink:#4A2B2E; --line:#D8C49A; --soft:#F1E6CF; --muted:#8C7069; --accent:#6D3640; --gold:#C9A24B; --flagbg:#F8EFD9; --warn:#B4532E;
           --head:'Spectral',Georgia,serif; --body:'Spectral',Georgia,serif; --label:'Cinzel',Georgia,serif; --r:2px; }

             --head:'Spectral',Georgia,serif; --body:'Spectral',Georgia,serif; --label:'Cinzel',Georgia,serif; --r:2px; }
  .ivory .brand,.burgundy .brand{font-family:'Allura',cursive;font-weight:400;font-size:2.3em;line-height:1;color:var(--accent)}

  .ivory .card,.burgundy .card{border-color:var(--line)}

  .burgundy input,.burgundy select,.burgundy textarea{background:#5E2E37;color:var(--ink);border-color:#A9854A}

  .burgundy .due.soon,.burgundy .flag{color:#F2D27A}
  .logo{height:46px;width:auto;margin-right:10px;vertical-align:middle} .burgundy .logo{filter:brightness(0) saturate(100%) invert(76%) sepia(43%) saturate(512%) hue-rotate(4deg) brightness(91%)}
  .tagline{display:block;font-family:var(--label);font-size:.62em;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .brandwrap{display:flex;align-items:center;min-width:0}
  @media (max-width:560px){ .ivory .brand,.burgundy .brand{font-size:1.7em;white-space:nowrap} .logo{height:36px;margin-right:8px} .tagline{font-size:.55em;letter-spacing:.12em} }
  .sky{ --bg:#F1FAFA; --card:#fff; --ink:#001E1E; --line:#BCE3EF; --soft:#E2F5FB; --muted:#4D727E; --accent:#015A84; --sky:#A6DDEF; --mid:#5FB4CB; --flagbg:#E6F6FB; --flag:#5FB4CB; --warn:#C0502A; --ok:#2E7D32;
         --head:'Outfit',-apple-system,sans-serif; --body:'Outfit',-apple-system,sans-serif; --label:'Questrial',-apple-system,sans-serif; --r:4px; }
  .sky body,.sky{font-weight:300} .sky b,.sky strong{font-weight:600}
  .sky header{background-color:var(--sky);border-bottom:1px solid #8CCFE3}
  .sky .brand{font-family:'Questrial',sans-serif;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-size:1.45em}
  .sky .tagline{color:var(--accent);opacity:.8}
  .sky .logo{height:64px;margin-right:14px}

  .sky .who{font-family:'Outfit',sans-serif;font-weight:600}
  .large{ --fs:18px; }
  /* Section menu: a drop-down on the left */
  .menurow{position:relative;display:flex;align-items:center;gap:10px;padding:10px 0 12px}
  .menubtn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:7px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-family:var(--label);font-size:.85em;letter-spacing:.08em;text-transform:uppercase;min-width:190px}
  body:not(.paper) .menubtn{text-transform:none;letter-spacing:.01em;font-weight:600;font-size:.95em}
  .menubtn .bars{font-size:1.2em;line-height:1} .menubtn .car{margin-left:auto;opacity:.6}
  .menubtn:focus-visible,nav.menu button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  nav.menu{position:absolute;top:calc(100% - 4px);left:0;z-index:20;min-width:260px;max-width:calc(100vw - 28px);max-height:72vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:1px}
  nav.menu[hidden],.menubtn[hidden]{display:none}
  .menubtn .n,nav.menu .n{display:inline-block;min-width:18px;padding:0 4px;border-radius:2px;background:var(--accent);color:#fff;font-size:.72em;text-align:center;font-weight:700;letter-spacing:0}
  form.add[data-form=signin] input{flex:0 0 auto!important}
  @media (max-width:560px){ .sky .brand{font-size:1.1em;letter-spacing:.2em} .sky .logo{height:50px;margin-right:10px} .me{flex-wrap:wrap;justify-content:flex-end;gap:6px} }
  nav.menu button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:var(--r);font-family:var(--label);font-size:.85em;letter-spacing:.08em;text-transform:uppercase}
  body:not(.paper) nav.menu button{text-transform:none;letter-spacing:.01em;font-size:.95em}
  nav.menu button:hover{background:var(--soft)} nav.menu button[aria-selected=true]{background:var(--soft);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
  nav.menu hr{border:none;border-top:1px solid var(--line);margin:4px 6px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.45 var(--body);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .lbl{font-family:var(--label);font-size:.73em;letter-spacing:.12em;text-transform:uppercase}
  body:not(.paper) .lbl{letter-spacing:.04em;font-weight:600}
  .muted{color:var(--muted)} .sm{font-size:.86em}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px 0}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-family:var(--head);font-size:1.45em;font-weight:700}
  .me{font-family:var(--label);font-size:.85em;display:flex;gap:10px;align-items:center}
  .me button{all:unset;cursor:pointer;text-decoration:underline}
  nav .n{display:inline-block;min-width:18px;margin-left:5px;padding:0 4px;border-radius:2px;background:var(--accent);color:#fff;font-size:.72em;text-align:center;font-weight:700}
  nav .n.warn{background:var(--warn)}
  main{padding:20px;max-width:1180px;margin:0 auto}
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
  .stack{display:grid;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .card h2{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .row{display:flex;gap:10px;align-items:flex-start;padding:8px 14px;border-top:1px solid var(--soft)}
  .card h2 + .row,.sub + .row{border-top:none}
  .sub{padding:10px 14px 4px;border-top:1px solid var(--soft)}
  .card h2 + .sub{border-top:none}
  .time{font-family:var(--label);font-size:.83em;width:64px;flex:none;padding-top:2px}
  .sw{width:8px;height:8px;flex:none;margin-top:.45em;border-radius:2px;background:var(--accent)}
  .chk{all:unset;box-sizing:border-box;cursor:pointer;width:18px;height:18px;flex:none;margin-top:2px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;font:700 12px var(--label);color:#fff}
  .chk.on{background:var(--accent);border-color:var(--accent)}
  .ro .chk,.ro [data-needs-edit]{pointer-events:none;opacity:.55}
  .done .txt{text-decoration:line-through;opacity:.5}
  .txt{flex:1;min-width:0;overflow-wrap:anywhere}
  .tag{font-family:var(--label);font-size:.66em;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border:1px solid currentColor;border-radius:2px;margin-left:6px;white-space:nowrap;color:var(--muted)}
  .who{display:inline-block;font-family:var(--label);font-size:.7em;font-weight:700;padding:1px 6px;border-radius:9px;color:#fff;margin-left:6px;white-space:nowrap}
  .next{padding:16px 18px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
  .next .title{font-family:var(--head);font-size:1.6em;font-weight:700;line-height:1.2;margin-top:2px}
  .stats{display:flex;gap:22px;flex-wrap:wrap}
  .stats b{display:block;font:700 1.45em var(--label)}
  form.add,.bar{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
  input,select,textarea{font:.93em var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
  form.add input:not([type]),form.add input[type=text]{flex:1 1 140px}
  .btn{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--label);font-size:.73em;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);text-align:center;white-space:nowrap}
  body:not(.paper) .btn{letter-spacing:.02em;text-transform:none;font-size:.87em;font-weight:600}
  .btn:hover{background:var(--soft)} .btn.go{background:var(--accent);border-color:var(--accent);color:#fff} .btn.sm{padding:4px 8px}
  .link{display:flex;justify-content:space-between;gap:10px;text-decoration:none}
  .link:hover .txt{text-decoration:underline}
  .empty{padding:12px 14px;font-style:italic;color:var(--muted)}
  .more{padding:6px 14px 10px 42px;font-family:var(--label);font-size:.77em}
  .more button{all:unset;cursor:pointer;text-decoration:underline}
  .pill{font-family:var(--label);font-size:.73em;padding:1px 6px;border-radius:10px;background:var(--soft);white-space:nowrap}
  .warn{margin-top:4px;padding:5px 8px;border-left:3px solid var(--flag);background:var(--flagbg);font-size:.87em}
  .flag{font-family:var(--label);font-size:.66em;color:#9a7412;border:1px solid var(--flag);border-radius:2px;padding:0 4px}
  .due{font-family:var(--label);font-size:.77em;white-space:nowrap} .late{color:var(--warn);font-weight:700} .soon{color:#9a7412;font-weight:700} .good{color:var(--ok);font-weight:700}
  .bar-track{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px;position:relative}
  .bar-fill{height:100%;background:var(--accent);border-radius:4px}
  .bar-mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
  .fuhead{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;width:100%}
  .fu .body{margin:6px 0 2px 20px}
  .fu .msg{margin-top:8px;padding:10px;background:var(--bg);border:1px dashed var(--soft);white-space:pre-wrap;font-size:.93em}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

  .acts .go{background:var(--accent);border-color:var(--accent);color:#fff}
  label.f{display:block;font-family:var(--label);font-size:.7em;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 3px}
  .evbtn{all:unset;cursor:pointer;flex:1;min-width:0} .evbtn:focus-visible{outline:2px solid var(--accent)}
  .evd{padding:2px 14px 10px 50px;font-size:.93em} .evd .acts{margin-top:6px}
  form.add details{flex-basis:100%} form.add summary{cursor:pointer;font-size:.85em;color:var(--muted);padding:2px 0}
  .evmore{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px} .evmore input,.evmore select{flex:1 1 140px}
  .sub2{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
  .tag.give{background:#E8F5E9;color:#2E7D32;border-color:#2E7D32} .tag.help{background:#FFF3E0;color:#B4532E;border-color:#B4532E} .tag.region{border-style:dashed}
  .dark .tag.give,.burgundy .tag.give{background:transparent;color:#9fd8a3;border-color:#9fd8a3} .dark .tag.help,.burgundy .tag.help{background:transparent;color:#f3b48a;border-color:#f3b48a}

  .f-in{width:100%} textarea.f-in{min-height:200px;resize:vertical;font:.93em/1.45 var(--body)}
  .big{font:700 2em var(--label)}
  .up{color:var(--ok)} .down{color:var(--warn)}

  .seg button{all:unset;cursor:pointer;padding:4px 10px;font-family:var(--label);font-size:.73em}
  .seg button[aria-pressed=true]{background:var(--accent);color:#fff}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{all:unset;cursor:pointer;width:26px;height:26px;border:1px solid var(--line);border-radius:var(--r);text-align:center;line-height:26px;font-weight:700}
  .day{border-left:3px solid var(--accent)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;padding:0 0 12px}
  .vrow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--soft)}
  .vrow .mv{all:unset;cursor:pointer;width:28px;height:28px;border:1px solid var(--line);border-radius:var(--r);text-align:center;line-height:28px}

  .banner{padding:8px 14px;margin-bottom:14px;border-radius:var(--r);background:var(--flagbg);border:1px solid var(--flag);font-size:.9em}
  footer{padding:8px 20px 28px;text-align:center;font-family:var(--label);font-size:.73em;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-family:var(--label);font-size:.8em;display:none;z-index:9}
  @media (max-width:640px){ header{padding:12px 14px 0} main{padding:14px} .next .title{font-size:1.3em} .menubtn{min-width:0} }
  /* Paper at night: warm ink-dark paper, same typewriter labels and book serif */
  .paper.papernight{ --bg:#1D1915; --card:#27211B; --ink:#EEE3D1; --line:#7E6F5E; --soft:#3A3129; --muted:#B4A58F; --warn:#E8946F; --flag:#E6B342; --flagbg:#3A3020; --ok:#9CCB8F; --onaccent:#1D1915; }

  .dark .btn.go,.dark .acts .go,.dark nav .n,.dark .menubtn .n,.dark .chk.on,.dark .seg button[aria-pressed=true],.dark .cn,.dark .send,.dark .bub.own{color:#15171a}
  .papernight .flag{color:#E6B342}

           --hbg:#A47E8C; --hfg:#F6ECE4; --flag:#DEB853; --flagbg:#FBF1D9; --warn:#B4532E; --ok:#5E7A3A; --onaccent:#F6ECE4;
           --head:'Cinzel',Georgia,serif; --body:'Belleza','Outfit',-apple-system,sans-serif; --label:'Belleza','Outfit',sans-serif; --r:14px; }

  .lavender header{background:var(--hbg);border-bottom:3px solid var(--gold)}
  .lavender .brand{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--hfg);font-size:1.35em}
  .lavender .tagline{font-family:'Allura',cursive;font-size:1.3em;letter-spacing:0;text-transform:none;color:var(--gold);margin-top:0;line-height:1}
  .lavender .logo{height:62px;margin-right:12px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .lavender .me,.lavender .me button{color:var(--hfg)}
  .lavender .menubtn{background:var(--card);border-color:var(--gold);border-radius:999px}
  .lavender nav.menu{border-color:var(--gold)} .lavender nav.menu button[aria-selected=true]{box-shadow:inset 3px 0 0 var(--gold)}
  .lavender .card{border-color:var(--line);box-shadow:0 1px 0 rgba(23,50,77,.05)}
  .lavender .card h2{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.18em;color:var(--accent);border-bottom:1px solid var(--lav);background:transparent}
  .lavender.lavendernight .card h2{color:var(--gold);border-bottom-color:var(--line)}
  .lavender .next .title{font-family:'Cinzel',serif;font-weight:600}
  .lavender .next{background:linear-gradient(135deg,var(--card) 0 60%,rgba(158,151,116,.18))}
  .lavender .btn.go,.lavender .acts .go,.lavender .seg button[aria-pressed=true],.lavender .chk.on,.lavender nav .n,.lavender .menubtn .n{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
  .lavender .pinned .card{border-left-color:var(--gold)} .lavender .bar-fill{background:var(--mauve)} .lavender.lavendernight .bar-fill{background:var(--lav)}
  .lavender .bub.own{background:var(--accent);border-color:var(--accent);color:var(--onaccent)} .lavender .av.ch{background:var(--soft);color:var(--mauve)}
  .lavender .msgs{background:transparent}
  @media (max-width:560px){ .lavender .brand{font-size:1.05em;letter-spacing:.22em} .lavender .logo{height:50px} .lavender .tagline{font-size:1.1em} }
  /* v3: Sky & navy at night (the dark half of Sky & navy for Light/Dark/Auto) */
  .sky.skynight{ --bg:#06141C; --card:#0C1F2A; --ink:#E4F2F7; --line:#1F4152; --soft:#132D3B; --muted:#8FB3C1; --accent:#6CC4DE; --sky:#0A1B25; --mid:#5FB4CB; --flagbg:#10303F; --flag:#5FB4CB; --warn:#F09A7A; --ok:#86C98A; --onaccent:#06141C; }
  .skynight header{border-bottom-color:#1F4152} .skynight .card h2{background:var(--soft)} .skynight .logo{filter:brightness(0) invert(.92)}
  .skynight .btn.go,.skynight .acts .go,.skynight nav .n,.skynight .chk.on,.skynight .seg button[aria-pressed=true],.skynight .menubtn .n,.skynight nav.menu .n{color:var(--onaccent)}
  .skynight input,.skynight select,.skynight textarea{background:#091922}
  .lnk{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  /* Messages */
  .chatwrap{max-width:760px;margin:0 auto;display:grid;gap:12px}
  .chathead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 6px 4px 14px} .chathead h2{border:none!important;padding:8px 0!important;background:none!important}
  .iconbtn{all:unset;cursor:pointer;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--accent)} .iconbtn:hover{background:var(--soft)}
  .av{--sz:44px;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;background:var(--av,var(--accent));color:#fff;display:grid;place-items:center;font:600 calc(var(--sz) * .36)/1 var(--body);letter-spacing:.02em}
  .av{position:relative} .av.on::after{content:'';position:absolute;right:-1px;bottom:-1px;width:30%;height:30%;min-width:9px;min-height:9px;border-radius:50%;background:#2FB344;border:2px solid var(--card);box-sizing:border-box}
  .av.ch{background:var(--soft);color:var(--accent);font-size:calc(var(--sz) * .5)}
  .csearch{position:relative;display:flex;align-items:center;margin:10px 12px 4px;color:var(--muted)}
  .csearch svg{position:absolute;left:11px;pointer-events:none}
  .csearch input{width:100%;min-height:38px;padding:8px 34px 8px 34px;border-radius:999px;border:1px solid var(--soft);background:var(--soft);font-size:16px}
  .csearch input::-webkit-search-cancel-button{display:none}
  .cx{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;line-height:1;color:var(--muted)} .csearch .cx{position:absolute;right:6px}
  .crow{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;position:relative}
  .crow:hover{background:var(--soft)}
  .crow + .crow::before{content:'';position:absolute;top:0;left:70px;right:14px;border-top:1px solid var(--soft)}
  .cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .ctop,.cbot{display:flex;align-items:center;gap:8px;min-width:0}
  .ctop b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cwhen{flex:none;font-size:.78em;color:var(--muted)}
  .cpre{flex:1;min-width:0;font-size:.9em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cpre.wrap{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--ink)}
  .cn{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--onaccent,#fff);font:700 .72em/20px var(--body);text-align:center}
  .crow.unread .ctop b{font-weight:700} .crow.unread .cpre{color:var(--ink)} .crow.unread .cwhen{color:var(--accent);font-weight:600}
  mark{background:rgba(230,179,66,.35);color:inherit;border-radius:3px;padding:0 1px}

/* =========================================================

function load(k){ try { return localStorage.getItem(k); } catch(_) { return null; } }
function save(k,v){ try { localStorage.setItem(k,v); } catch(_){} }
let KEY = load('dash-key') || '';
let lastMsg = '', data = null, lastErr = null, busy = {}, open = {}, editing = {}, expanded = {}, draft = null, evOpen = null, evEdit = null, feedMine = load('dash-feedmine') === '1';
let tab = load('dash-tab') || 'today', mineOnly = load('dash-mine') === '1', menuOpen = false, signInfo = null;
const isEditing = () => Object.keys(editing).length > 0 || !!draft;

/** The installed phone app (GitHub Pages) reaches the same script over HTTPS; the Google-served page uses google.script.run. */
async function post(fn, args){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 45000);
  try {
    const res = await fetch(window.FAMILY_API, { method: 'POST', body: JSON.stringify({ fn, args }), signal: ctl.signal, redirect: 'follow' });   // text/plain: no CORS preflight
    const out = await res.json();
    if (out && out.error) throw new Error(out.error);
    return out.result;
  } catch (e) { if (e.name === 'AbortError') throw new Error('timeout'); if (e instanceof TypeError) throw new Error('offline'); throw e; }
  finally { clearTimeout(t); }
}
function call(p){
  if (window.FAMILY_API) return post('api', [KEY, p]);
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 45000));
  return Promise.race([timeout, new Promise((res, rej) => {
    if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(KEY, p);
    else if (window.__mock) window.__mock(KEY, p).then(res, rej);
    else rej(new Error('offline'));
  })]);
}
/* Requests can come back out of order. Only the newest answer is shown, and a plain refresh never
   overwrites the screen while a change is still being saved (it could be from before the change). */
let seqStarted = 0, seqShown = 0, pendingActs = 0, lastActSeq = 0;
/** Calls a public server function (sign-in) – no key needed. */
/* ===== Live chat connection (shared by Bellah Family HQ and Peregrine Team) =====
 * One WebSocket to the chat service. Asks get an answer (promise); everything else the service sends
 * (new messages, read marks, "seen", deletes, list changes, who's online) goes to on(msg).
 * Reconnects on its own with a growing wait, fetches a fresh chat pass when the old one runs out,
 * and pauses while the app is hidden for a while so phones don't keep a connection open in a pocket.
 */
function LiveChat(o){   // o: { url, space, ticket: () => Promise<{ticket, exp}>, on(msg), onUp(), onDown() }
  let ws = null, pass = null, tries = 0, wait = 0, ping = 0, idle = 0, up = false, stopped = false, n = 0;
  const pend = {}, queue = [];
  const base = () => String(o.url).replace(/\/+$/, '');
  async function getPass(){
    if (pass && pass.exp * 1000 - Date.now() > 5 * 60000) return pass.ticket;
    pass = await o.ticket();
    // kept where the notification handler can reach it, so a notification arriving counts as "Delivered"
    try { const c = await caches.open('chat-pass'); await c.put('/chat-pass', new Response(JSON.stringify({ url: base(), space: o.space, ticket: pass.ticket, exp: pass.exp }))); } catch (_) {}
    return pass.ticket;
  }
  async function connect(){
    if (stopped || ws || document.hidden) return;
    clearTimeout(wait);
    let t; try { t = await getPass(); } catch (e) { if (/unauthorized|^signin/.test(String(e && e.message))) { stop(); return; } return later(); }
    if (stopped || ws) return;
    let opened = false;
    const s = ws = new WebSocket(base().replace(/^http/, 'ws') + '/s/' + o.space + '/ws?t=' + encodeURIComponent(t));
    s.onopen = () => { opened = true; };
    s.onmessage = e => {
      let d; try { d = JSON.parse(e.data); } catch (_) { return; }
      if (d.t === 'hello'){ up = true; tries = 0; clearInterval(ping); ping = setInterval(() => raw({ t: 'ping' }), 25000); queue.splice(0).forEach(x => s.send(x)); }
      if (d.t === 'err' && d.code === 'expired'){ pass = null; }
      if (d.rid && pend[d.rid]){ const p = pend[d.rid]; delete pend[d.rid]; clearTimeout(p.to); if (d.t === 'err') p.no(new Error(d.msg || 'Something went wrong')); else p.yes(d); return; }
      if (d.t === 'pong') return;
      try { o.on(d); } catch (err) { console.error(err); }
      if (d.t === 'hello' && o.onUp) try { o.onUp(); } catch (err) { console.error(err); }
    };
    s.onclose = ev => {
      if (ws === s) ws = null; const was = up; up = false; clearInterval(ping);
      if (!opened || ev.code === 4001) pass = null;           // refused at the door: usually an old pass
      Object.keys(pend).forEach(k => { const p = pend[k]; delete pend[k]; clearTimeout(p.to); p.no(new Error('The connection dropped – try again')); });
      if (was && o.onDown) try { o.onDown(); } catch (_) {}
      if (!stopped) later();
    };
    s.onerror = () => {};
  }
  function later(){ clearTimeout(wait); const ms = Math.min(30000, 800 * Math.pow(2, tries++)) * (0.7 + Math.random() * 0.6); wait = setTimeout(connect, ms); }
  function raw(x){ const s = JSON.stringify(x); if (ws && up) { try { ws.send(s); } catch (_) {} } else { queue.push(s); if (queue.length > 50) queue.shift(); connect(); } }
  /** Fire and forget (read marks, acks, leaving a conversation). */
  function send(x){ raw(x); }
  /** A question with an answer: open, send, search, new/edit channel, delete. */
  function ask(x, ms){
    const rid = 'r' + (++n) + Math.random().toString(36).slice(2, 6);
    return new Promise((yes, no) => { pend[rid] = { yes, no, to: setTimeout(() => { if (pend[rid]) { delete pend[rid]; no(new Error('No answer from the chat – check your connection')); } }, ms || 15000) }; raw(Object.assign({ rid }, x)); });
  }
  /** Photos: uploaded first, then sent as part of the message. */
  async function upload(dataUrl){
    const blob = await (await fetch(dataUrl)).blob(), t = await getPass();
    const r = await fetch(base() + '/s/' + o.space + '/photo?t=' + encodeURIComponent(t), { method: 'POST', body: blob, headers: { 'content-type': blob.type || 'image/jpeg' } });
    const j = await r.json().catch(() => ({})); if (!r.ok || !j.key) { if (r.status === 401) pass = null; throw new Error(j.error || 'The photo didn\'t upload'); }
    return j.key;
  }
  async function photo(id){
    const t = await getPass(), r = await fetch(base() + '/s/' + o.space + '/photo/' + encodeURIComponent(id) + '?t=' + encodeURIComponent(t));
    if (!r.ok) { const j = await r.json().catch(() => ({})); if (r.status === 401) pass = null; throw new Error(j.error || 'Couldn\'t load the photo'); }
    const b = await r.blob();
    return await new Promise((yes, no) => { const f = new FileReader(); f.onload = () => yes(f.result); f.onerror = () => no(new Error('Couldn\'t read the photo')); f.readAsDataURL(b); });
  }
  function stop(){ try { caches.delete('chat-pass'); } catch (_) {} stopped = true; clearTimeout(wait); clearTimeout(idle); clearInterval(ping); if (ws) try { ws.close(1000); } catch (_) {} ws = null; up = false; }
  document.addEventListener('visibilitychange', () => {
    if (stopped) return;
    clearTimeout(idle);
    if (document.hidden) idle = setTimeout(() => { if (document.hidden && ws) try { ws.close(1000); } catch (_) {} }, 60000);
    else { tries = 0; connect(); }
  });
  window.addEventListener('online', () => { if (!stopped) { tries = 0; connect(); } });
  connect();
  return { send, ask, upload, photo, stop, get up(){ return up; } };
}

function runFn(name, ...args){
  if (window.FAMILY_API) return post(name, args);
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 45000));
  return Promise.race([timeout, new Promise((res, rej) => {
    if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(res).withFailureHandler(rej)[name](...args);
    else if (window.__mockFn) window.__mockFn(name, args).then(res, rej);
    else rej(new Error('offline'));
  })]);
}
function loadSignInfo(){ if (signInfo) return; signInfo = { loading: true }; runFn('signInInfo').then(i => { signInfo = i || {}; render(); }, () => { signInfo = {}; render(); }); }
async function refresh(p){
  if (!KEY){ data = null; lastErr = 'nokey'; loadSignInfo(); render(); return; }
  if (!(p && p.action) && outbox.length && queueOK()){ scheduleFlush(0); return; }   // saving first brings back the fresh picture anyway
  const isAct = !!(p && p.action), seq = ++seqStarted;
  if (isAct){ pendingActs++; lastActSeq = seq; }
  let got = null, err = null;
  try { got = await call(p || {}); } catch (e) { err = e; }
  if (isAct) pendingActs--;
  const stale = seq < seqShown || (!isAct && pendingActs > 0) || (isAct && seq !== lastActSeq) || (!err && outbox.length > 0 && queueOK());
  if (stale && !err){ if (isAct && !pendingActs && seq === lastActSeq) refresh(); return; }
  if (err && isAct && pendingActs){ toast("Couldn't save: " + String(err && err.message || err).replace(/^(Error|Exception):\s*/, '')); return; }
  seqShown = seq;
  try {
    if (err) throw err;
    if (!got || !got.me || !got.order || !/^[23]$/.test(String(got.version || '').split('.')[0])){
      data = null; lastErr = 'mismatch'; lastMsg = 'Code.gs is ' + (got && got.version ? 'version ' + got.version : 'an older version') + ', but this page needs version 3.';
      render(); return;
    }
    data = got; lastErr = null; liveSync(); save('dash-cache', JSON.stringify(data));
    if (pendingGo){ const g = pendingGo; pendingGo = ''; setTimeout(() => goTo(g), 0); }
    pushCheck();
  }
  catch(e){
    const msg = String(e && e.message || e);
    if (/unauthorized|expired/.test(msg)){ liveEnd(); KEY = ''; save('dash-key', ''); try { localStorage.removeItem('dash-cache'); } catch(_){} data = null; lastErr = /expired/.test(msg) ? 'expired' : 'badkey'; loadSignInfo(); }
    else {
      lastErr = e; lastMsg = msg.replace(/^(Error|Exception):\s*/, ''); toast(p && p.action ? "Couldn't save: " + lastMsg : /timeout/.test(msg) ? 'Google is taking too long.' : "Couldn't reach Google. Showing the last saved view.");
      if (isAct && data) setTimeout(() => { if (!pendingActs) refresh(); }, 300);   // undo the on-screen change: show what's really saved
    }
  }
  busy = {};
  try { render(); } catch (e) { data = null; lastErr = 'mismatch'; lastMsg = 'The page could not show this data: ' + (e && e.message || e); render(); }
}

const TABNAME = { calendar:'Calendar', week:'Week', todos:'To-dos', shopping:'Shopping', meals:'Meals', routines:'Routines', upkeep:'Upkeep', bills:'Bills', budget:'Budget',
                  goals:'Goals', numbers:'Numbers', trips:'Trips', 'dates-out':'Date nights', dates:'Dates', notes:'Notes', links:'Links', followups:'Follow-ups', inventory:'Inventory',
                  chat:'Messages', directory:'Directory', gatherings:'Gatherings', polls:'Polls', recipes:'Recipes', market:'Marketplace', stories:'Stories', game:'Daily Word' };
function enabledFeatures(){ return (data.order || []).filter(([f]) => on(f)).map(([f]) => f); }
function myFeatures(){
  const enabled = enabledFeatures(), v = data.view && data.view.features;

function counts(){
  const t = T(), c = {};
  c.calendar = (data.events || []).filter(e => e.day === t && !e.done).length;
  c.chat = chatUnread();
  c.todos = ((data.tasks && data.tasks.open) || []).filter(x => mine(x.for)).length;
  c.followups = (data.followups || []).filter(f => f.due && f.due <= t).length;
  c.routines = (data.routines || []).filter(r => r.dueToday && !r.done && mine(r.who)).length;
  c.shopping = (data.shopping || []).filter(s => !s.got).length;
  c.inventory = (data.inventory || []).filter(i => i.onHand !== null && i.par !== null && i.onHand < i.par).length;
  c.dates = (data.dates || []).filter(d => d.days <= 7).length;
  c.upkeep = (data.upkeep || []).filter(u => u.days !== null && u.days <= 14).length;
  c.bills = (data.bills || []).filter(b => !b.paid && b.days !== null && b.days <= 7).length;
  c.budget = (data.budget || []).filter(b => b.status === 'over').length;
  c.gatherings = (data.gatherings || []).filter(g => g.days >= 0 && g.days <= 30 && !g.mine).length;
  c.polls = (data.polls || []).filter(p => p.open && !p.mine.length).length;
  c.game = data.game && !data.game.mine.r && !ro() ? 1 : 0;
  c.market = (data.market || []).filter(m => m.status === 'Open' && m.from !== data.me.name && (!myRegion() || !m.region || m.region === myRegion())).length;
  const late = { bills: (data.bills || []).some(b => !b.paid && b.days < 0), upkeep: (data.upkeep || []).some(u => u.days < 0), budget: c.budget > 0, followups: (data.followups || []).some(f => f.due && f.due < t) };
  return { c, late };
}

const gStamp = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');

function spark(series){
  if (!series || series.length < 2) return '';

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="trend"><path d="${series.map((x, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(x[1]).toFixed(1)}`).join('')}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>
    <div class="lbl muted" style="display:flex;justify-content:space-between"><span>${short(series[0][0])}</span><span>${short(series[series.length-1][0])}</span></div>`;
}

  const nf = newFeatures();

function pinnedPolls(){
